[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "unirobosim-mcp"
version = "0.10.0"
description = "MCP server for UniRoboSim evidence, state inspection, camera images, and owned-session control"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "Hofee", email = "lexhofee@gmail.com"}]
dependencies = [
  "mcp>=1.10.1,<3",
  "unirobosim>=0.10,<0.11",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]
isaaclab = [
  "mcp==1.10.1",
]

[project.scripts]
unirobosim-mcp = "unirobosim_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unirobosim_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["unirobosim_mcp"]
mypy_path = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["unirobosim_mcp"]

[tool.coverage.report]
fail_under = 95
show_missing = true
